name: Build Android APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-apk:
    name: Build Android APK
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '21'

      - name: Print Android Keystore Fingerprints
        run: |
          echo "==================== ANDROID DEBUG KEYSTORE FINGERPRINTS ===================="
          keytool -list -v -keystore android/app/debug.keystore -alias androiddebugkey -storepass android | grep -E "(SHA1|SHA256):"
          echo "=============================================================================="

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi,x86_64-linux-android

      - name: Install cargo-ndk
        run: cargo install cargo-ndk --locked

      - name: Build Brave adblock-rust Native Libraries
        run: |
          cd android/adblock-rust
          mkdir -p ../app/src/main/jniLibs
          cargo ndk -t arm64-v8a -t armeabi-v7a -t x86_64 -o ../app/src/main/jniLibs build --release

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2

      - name: Install Dependencies
        run: bun install

      - name: Build Web Assets
        env:
          VITE_TMDB_API_KEY: "a0f3ec7ad97db59c00931e7a88a827da"
          VITE_SUPABASE_URL: "https://uwhawjcknqilypbgoyxo.supabase.co"
          VITE_SUPABASE_PROJECT_ID: "uwhawjcknqilypbgoyxo"
          VITE_SUPABASE_PUBLISHABLE_KEY: "sb_publishable_CXpMyEAQc2MWHs029MOn-A_DnDfF-YF"
          VITE_SUPABASE_ANON_KEY: "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InV3aGF3amNrbnFpbHlwYmdveXhvIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTMzMTU5NzQsImV4cCI6MjEwODg5MTk3NH0.ZJHgMkSjc1nIXKZir4zh-5RfZUi13rUYC0cyuVtTV8U"
          VITE_BACKEND_URL: "https://lynnn.lovable.app"
          VITE_PAYHERO_API_USERNAME: "Fwn62pjQ6lqCzqeExV9h"
          VITE_PAYHERO_API_PASSWORD: "Dfy4GMR0UefuaAU7vrm95nZpPEXrFPpahMynupTb"
          VITE_PAYHERO_CHANNEL_ID: "12608"
        run: |
          bun run build
          mkdir -p dist/client
          if [ -d ".output/public" ]; then
            cp -r .output/public/* dist/client/
          fi
          test -f dist/client/index.html || { echo "index.html missing in dist/client"; exit 1; }

      - name: Sync Capacitor Android
        run: bunx cap sync android

      - name: Build Android APK with Gradle
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Prepare APK Asset
        run: |
          cp android/app/build/outputs/apk/debug/app-debug.apk bujuu-app.apk

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: bujuu-app-debug.apk
          path: bujuu-app.apk
          if-no-files-found: error

      - name: Publish or Update GitHub Release
        uses: softprops/action-gh-release@v2
        if: github.ref == 'refs/heads/main'
        with:
          tag_name: latest
          name: "BUJUU Android App v2.1"
          body: |
            ### BUJUU Android Release v2.1 (Device Trial, Kids Mode, All-Genres & Dedicated Backend)
            - **New Dedicated Supabase Backend**: Integrated high-speed PostgreSQL backend for 72-hour device-based trials, PayHero M-Pesa STK push payments (KSh 150 / 30 days), and cross-device subscription transfer codes.
            - **Adult & Kids Profiles with Parental PIN**: Smooth profile switching with 4-digit numeric TV & touch keypad PIN protection to guard adult content and curate kid-friendly catalogs.
            - **Comprehensive All-Genres Browsing**: Over 15 dynamic genre sections and high-speed hero banner carousel for effortless discovery.
            - **Brave adblock-rust Engine**: Complete native popup blocking, redirect suppression, and video ad shielding for flawless streaming across all providers.
            - **Seamless In-Place Android Updates**: versionCode 12 (v2.1) signed with permanent debug keystore for direct update installation without uninstalling.
          files: bujuu-app.apk
          prerelease: false
          make_latest: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
